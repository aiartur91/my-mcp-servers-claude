[project]
name = "mcp-server-groomershop"
version = "0.1.0"
description = "MCP server for scraping product data from groomershop.pl (images, descriptions, prices, EAN, etc.)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Artur Tomaszewski", email = "ai.arturtomaszewski@gmail.com" }]
keywords = ["scraping", "mcp", "groomershop", "e-commerce"]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
]
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "mcp>=1.29.0,<2",
    "pydantic>=2.0.0",
]

[project.scripts]
mcp-server-groomershop = "mcp_server_groomershop:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = ["pyright>=1.1.389", "ruff>=0.7.3", "pytest>=8.0.0", "pytest-asyncio>=0.21.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
